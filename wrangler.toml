name = "mukar"
main = "worker/src/index.js"
compatibility_date = "2026-01-01"

# The Worker serves the built frontend directly as static assets.
# Build the frontend first (npm run build:frontend) so frontend/dist exists.
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "mukar-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# Set with: wrangler secret put ANTHROPIC_API_KEY
# [vars] is only for non-secret values; do not put the key here.
